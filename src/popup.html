<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<div class="pop-top">
  <img src="../icons/icon32.png" width="24" height="24" alt="">
  <strong>Memory Bridge</strong>
  <label><input type="checkbox" id="enabled"> <span data-i18n="popEnabled"></span></label>
</div>
<div class="pop-body">
  <p id="who" class="who"></p>
  <h2 data-i18n="popRecent"></h2>
  <ul id="log" class="log"></ul>
  <pre id="diag" class="diag" hidden></pre>
  <div class="pop-actions">
    <button id="opts" class="btn primary" data-i18n="popOptions"></button>
    <button id="diagBtn" class="btn" data-i18n="popDiag"></button>
    <button id="clear" class="btn ghost" data-i18n="popClear"></button>
  </div>
</div>
<script src="i18n.js"></script><script src="popup.js"></script>
</body></html>
