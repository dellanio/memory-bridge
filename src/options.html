<!doctype html><html><head><meta charset="utf-8"><title>Memory Bridge for Mem0</title>
<link rel="stylesheet" href="ui.css"></head><body style="max-width:640px">
<header class="brand">
  <img src="../icons/icon48.png" width="48" height="48" alt="">
  <div><h1 data-i18n="optHeading"></h1><div class="muted" data-i18n="optTitle"></div></div>
</header>

<h2 data-i18n="secAccount"></h2>
<label><input type="radio" name="auth" value="oauth"> <span data-i18n="authOauth"></span></label>
<div id="oauthBox" class="row" style="margin-left:22px">
  <span id="authState" class="muted"></span>
  <button id="connect" data-i18n="connect"></button>
  <button id="disconnect" data-i18n="disconnect"></button>
</div>
<label><input type="radio" name="auth" value="apikey"> <span data-i18n="authApikey"></span></label>
<div id="keyBox" style="margin-left:22px">
  <label class="muted" data-i18n="apiKeyLabel"></label>
  <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
</div>
<div class="row" style="margin-top:8px"><button id="test" data-i18n="test"></button><span id="testOut" class="muted"></span></div>

<h2 data-i18n="secUser"></h2>
<label class="muted" data-i18n="userIdLabel"></label>
<input id="userId" type="text" spellcheck="false" placeholder="ex.: maria">

<h2 data-i18n="secCapture"></h2>
<label><input type="radio" name="mode" value="manual"> <span data-i18n="modeManual"></span></label>
<label><input type="radio" name="mode" value="auto"> <span data-i18n="modeAuto"></span></label>
<p class="muted" data-i18n="sitesLabel"></p>
<div class="site"><label><input type="checkbox" id="site_chatgpt"> ChatGPT</label><input type="text" id="app_chatgpt"></div>
<div class="site"><label><input type="checkbox" id="site_gemini"> Gemini</label><input type="text" id="app_gemini"></div>
<label><input type="checkbox" id="redact"> <span data-i18n="redactLabel"></span></label>

<p class="row"><button id="save" data-i18n="save"></button><span id="saveOut" class="muted"></span></p>
<p class="muted" data-i18n="privacy"></p>
<footer>By Dellanio Alencar - <a href="https://dellanio.com" target="_blank" rel="noopener">https://dellanio.com</a></footer>
<script src="i18n.js"></script><script src="options.js"></script>
</body></html>
